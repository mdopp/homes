name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lines as gofmt writes them, the count scripts/loc.sh caps
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go test ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/homes
      - name: each area under its cap, no import across the areas' rules
        run: scripts/loc.sh
  ratchet:
    # dead code, staticcheck, duplicates and complexity only go down; the
    # tools pinned in the script, today's findings in scripts/ratchet/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 -m unittest scripts/test_ratchet.py
      - run: scripts/ratchet.py
  e2e:
    # the family pages in a real browser against cmd/homesdemo's fakes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14
  image:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign signs keyless with this workflow's identity (Laib ADR 0034)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        name: the version Laib shows the family between two images
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/mdopp/homes:latest,ghcr.io/mdopp/homes:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: sigstore/cosign-installer@v3
      - name: sign the image; Laib proposes a new digest of ours only with this signature (Laib ADR 0034)
        run: cosign sign --yes ghcr.io/mdopp/homes@${{ steps.build.outputs.digest }}
